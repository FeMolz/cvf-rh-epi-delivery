name: Backup PostgreSQL (se mudou)

on:
  schedule:
    # A cada hora, no minuto 5 (UTC)
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  backup-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

      - name: Executar backup condicional
        id: backup
        run: |
          node scripts/backup-postgres-se-mudou.mjs
          if compgen -G "${BACKUP_DIR}/*.sql.gz" > /dev/null; then
            echo "criado=true" >> "$GITHUB_OUTPUT"
          else
            echo "criado=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_BACKUP_DIRECT_URL: ${{ secrets.DATABASE_BACKUP_DIRECT_URL }}
          BACKUP_DIR: ${{ runner.temp }}/backups

      - name: Publicar artefato quando houver backup novo
        if: steps.backup.outputs.criado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backups/*.sql.gz
          retention-days: 90
