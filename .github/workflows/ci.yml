name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

defaults:
  run:
    working-directory: backend

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: Gerar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: ESLint
        run: npm run lint

      - name: Executar testes unitários com coverage
        run: npm run test:coverage -w backend
        env:
          JWT_SECRET: jwt-secreto-apenas-ambiente-teste-com-16-chars
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: Smoke de rotas HTTP
        run: npm run test:routes
        env:
          JWT_SECRET: jwt-secreto-apenas-ambiente-teste-com-16-chars
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

  testes-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: .

      - name: ESLint frontend
        run: npm run lint -w frontend

      - name: Testes Vitest frontend com coverage
        run: npm run test:coverage -w frontend

  testes-integracao:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rh_system_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rh_system_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: Aplicar schema no banco de integração
        run: npx prisma db push
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: Executar testes de integração
        run: npm run test:integracao
        working-directory: backend
        env:
          RUN_INTEGRATION_TESTS: 'true'
          JWT_SECRET: jwt-secreto-apenas-ambiente-teste-com-16-chars
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

  testes-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      PORT: '3001'
      RH_API_PORT: '3001'
      JWT_SECRET: jwt-secreto-apenas-ambiente-teste-com-16-chars
      ADMIN_SEED_PASSWORD: AlterarSenha123!
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public
      REDIS_URL: ''
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET_EPI_REPORTS: epi-reports-dev-teste

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rh_system_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rh_system_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: .

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public

      - name: Instalar Chrome para Puppeteer
        run: npm run puppeteer:install -w backend

      - name: Configurar Chrome do Puppeteer para o backend
        run: |
          CHROME_PATH=$(node -e "import puppeteer from 'puppeteer'; console.log(puppeteer.executablePath())")
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
        working-directory: backend

      - name: Instalar navegador Playwright
        run: npx playwright install --with-deps chromium
        working-directory: .

      - name: Preparar ambiente de teste do frontend
        run: cp .env.test.example .env.test
        working-directory: frontend

      - name: Validar secrets do Supabase
        run: node scripts/validar-supabase-ci.mjs
        working-directory: .

      - name: Executar testes E2E
        run: npm run test:e2e
        working-directory: .
