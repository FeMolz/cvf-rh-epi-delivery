name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar testes
        run: npm test
        env:
          JWT_SECRET: jwt-secreto-apenas-ambiente-teste-com-16-chars
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rh_system_ci?schema=public
